[project]
name = "olx-aluguel-mcp"
version = "0.1.0"
description = "Servidor MCP para buscar alquileres en OLX Brasil y detectar posibles fraudes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "pydantic>=2",
]

[project.scripts]
olx-aluguel-mcp = "olx_aluguel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olx_aluguel_mcp"]
